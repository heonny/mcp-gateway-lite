server:
  host: 0.0.0.0
  port: 8610
  endpoint: mcp
  requestBodyLimit: 1mb
  requestTimeoutMs: 10000

auth:
  enabled: true
  tokenEnv: ${MCP_BEARER_TOKEN_ENV:-MCP_BEARER_TOKEN}
  protectMetrics: true
  protectHealth: false

security:
  queryLogLevel: redacted
  rateLimit:
    enabled: true
    windowMs: 60000
    maxRequests: 120

observability:
  metricsEnabled: true
  healthPath: /health
  metricsPath: /metrics

adapters:
  postgres:
    type: postgres
    enabled: true
    path: postgres
    host: ${POSTGRES_HOST:-postgres}
    port: ${POSTGRES_PORT:-5432}
    database: ${POSTGRES_DATABASE:-app}
    userEnv: ${POSTGRES_USER_ENV:-POSTGRES_USER}
    passwordEnv: ${POSTGRES_PASSWORD_ENV:-POSTGRES_PASSWORD}

  redis:
    type: redis
    enabled: true
    path: redis
    host: ${REDIS_HOST:-redis}
    port: ${REDIS_PORT:-6379}
    passwordEnv: ${REDIS_PASSWORD_ENV:-REDIS_PASSWORD}
    db: ${REDIS_DB:-0}

  clickhouse:
    type: clickhouse
    enabled: true
    path: clickhouse
    host: ${CLICKHOUSE_HOST:-clickhouse}
    port: ${CLICKHOUSE_PORT:-8123}
    database: ${CLICKHOUSE_DATABASE:-default}
    userEnv: ${CLICKHOUSE_USER_ENV:-CLICKHOUSE_USER}
    passwordEnv: ${CLICKHOUSE_PASSWORD_ENV:-CLICKHOUSE_PASSWORD}
    protocol: ${CLICKHOUSE_PROTOCOL:-http}
