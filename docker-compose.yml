networks:
  heonny-net:
    external: true

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-gateway-lite:local
    container_name: mcp-gateway-lite
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Tailnet access goes through `tailscale serve` (../../tailscale-expose.sh).
      - "127.0.0.1:8610:8610"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ../config.yml:/app/config.yml:ro
    networks:
      - heonny-net
    command: ["dist/main.js", "--config", "/app/config.yml"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8610/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
